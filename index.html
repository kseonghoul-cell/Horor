<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><meta name="robots" content="noindex,nofollow">
<title>Quiet Room</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080909;color:#ddd;font-family:Georgia,serif}
#room{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,#26302d 0,#111715 38%,#050606 78%);transition:filter .12s}
#room:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9.8%,#0008 10% 10.2%),linear-gradient(#0008,transparent 35%,#000b);opacity:.65}
.window{position:absolute;top:12%;width:min(48vw,260px);height:55%;border:8px solid #080b0a;box-shadow:0 0 55px #9ab4a322,inset 0 0 40px #000;background:linear-gradient(90deg,transparent 48%,#050707 49% 51%,transparent 52%),linear-gradient(0deg,transparent 48%,#050707 49% 51%,transparent 52%),linear-gradient(#182321,#070a09)}
.floor{position:absolute;bottom:0;width:100%;height:26%;background:repeating-linear-gradient(95deg,#171c1a 0 2px,#080a09 3px 80px);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%)}
.hint{position:absolute;bottom:7%;color:#68706c;font:11px Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase}
#reveal{position:fixed;inset:0;display:none;place-items:center;background:#000;z-index:5}
#reveal.show{display:grid;animation:slam .18s steps(2,end)}
@keyframes slam{0%{transform:scale(1.8);filter:brightness(5)}100%{transform:scale(1);filter:brightness(1)}}
.face{width:100vw;height:100vh;display:block}
#stop{position:fixed;z-index:9;right:14px;top:14px;border:1px solid #aaa6;background:#111b;color:#ddd;padding:10px 14px;border-radius:4px;font:12px Arial;opacity:.4}
#stop:focus,#stop:hover{opacity:1}
#replay{display:none;position:fixed;z-index:10;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#111;color:#ddd;border:1px solid #777}
#replay.show{display:block}
</style></head>
<body>
<main id="room" aria-label="A dim empty room"><div class="window"></div><div class="floor"></div><div class="hint">please wait…</div></main>
<section id="reveal" aria-label="Surprise">
<svg class="face" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A terrifying shadow face">
<defs>
<radialGradient id="skin"><stop stop-color="#b8b4a5"/><stop offset=".42" stop-color="#77776e"/><stop offset=".78" stop-color="#252725"/><stop offset="1" stop-color="#030404"/></radialGradient>
<radialGradient id="eye"><stop stop-color="#fff"/><stop offset=".16" stop-color="#ffded0"/><stop offset=".35" stop-color="#9d0808"/><stop offset=".7" stop-color="#270000"/><stop offset="1" stop-color="#000"/></radialGradient>
<filter id="rough"><feTurbulence baseFrequency=".8" numOctaves="3" seed="12"/><feDisplacementMap in="SourceGraphic" scale="13"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="900" height="1200" fill="#000"/>
<ellipse cx="450" cy="590" rx="385" ry="570" fill="#5d0709" opacity=".55" filter="url(#blur)"/>
<path d="M110 120 Q450 -30 790 120 L850 650 Q820 1110 450 1190 Q80 1100 50 650Z" fill="url(#skin)" filter="url(#rough)"/>
<path d="M105 300 Q200 90 340 210 L250 390 100 460Z M795 300 Q700 90 560 210 L650 390 800 460Z" fill="#090a09"/>
<path d="M130 520 Q270 330 420 490 Q300 620 130 520Z M770 520 Q630 330 480 490 Q600 620 770 520Z" fill="#050505"/>
<ellipse cx="278" cy="505" rx="100" ry="85" fill="url(#eye)"/><ellipse cx="622" cy="505" rx="100" ry="85" fill="url(#eye)"/>
<path d="M450 440 Q390 620 420 710 Q450 760 480 710 Q510 620 450 440Z" fill="#111513"/>
<path d="M260 790 Q450 710 640 790 Q620 1010 450 1040 Q280 1010 260 790Z" fill="#050303"/>
<path d="M285 800 L330 925 365 810 400 940 440 805 480 940 520 810 565 925 615 800" fill="#ddd8c9" stroke="#322b28" stroke-width="12"/>
<path d="M140 600 Q190 760 260 790 M760 600 Q710 760 640 790" stroke="#151615" stroke-width="28" fill="none"/>
<g fill="none" stroke="#b6b1a2" stroke-width="5" opacity=".35"><path d="M190 250l80 130-30 90M710 250L630 380l30 90M190 970l100-100M710 970L610 870"/></g>
<rect width="900" height="1200" fill="#000" opacity=".18"/>
</svg></section>
<button id="stop" type="button">Stop</button><button id="replay" type="button">Replay</button>
<script>
(()=>{const room=document.getElementById('room'),reveal=document.getElementById('reveal'),stop=document.getElementById('stop'),replay=document.getElementById('replay');let timer=null,ctx=null,stopped=false;
function sting(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();if(ctx.state==='suspended')ctx.resume().catch(()=>{});const now=ctx.currentTime;const master=ctx.createGain();master.gain.setValueAtTime(.0001,now);master.gain.exponentialRampToValueAtTime(.16,now+.025);master.gain.exponentialRampToValueAtTime(.0001,now+.75);master.connect(ctx.destination);[110,164.81,233.08,932].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i===3?'sawtooth':'triangle';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*.72,now+.5);g.gain.value=i===3?.16:.55;o.connect(g);g.connect(master);o.start(now);o.stop(now+.78)});}catch(e){}}
function fire(){if(stopped)return;room.style.display='none';reveal.classList.add('show');sting();replay.classList.add('show')}
function start(){stopped=false;replay.classList.remove('show');reveal.classList.remove('show');room.style.display='grid';clearTimeout(timer);timer=setTimeout(fire,4600)}
function halt(){stopped=true;clearTimeout(timer);if(ctx){ctx.close().catch(()=>{});ctx=null}reveal.classList.remove('show');room.style.display='grid';replay.classList.remove('show')}
stop.addEventListener('click',halt);replay.addEventListener('click',start);document.addEventListener('keydown',e=>{if(e.key==='Escape')halt()});start();
})();
</script></body></html>
